# Push reminders are now triggered by Vercel Cron (vercel.json).
# This workflow is kept for manual dispatch only — use it to force a run or test.
name: Push reminders (manual)

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Hit /api/cron/push-reminders
        run: |
          curl -fsS -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://prokol.io/api/cron/push-reminders
